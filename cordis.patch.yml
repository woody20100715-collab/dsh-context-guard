# dsh-context-guard 的 bundle 补丁层。
#
# 顶层是 loader patch 数组：insert 追加新行，id + disabled 关闭已有行。
# 这份配置会随 dsh plugin add 一起生效，也可以直接把需要的键抄进你自己的 cordis.patch.yml。

# 关掉内置压缩后端。ctx.compaction 是单例，只允许一个实现挂上去；
# 想保留 compaction-basic 就把这条删掉，并在下面把 enabled 设成 false。
- id: compaction-basic
  disabled: true

- insert:
    - id: context-guard
      name: 'dsh-context-guard'
      config:
        # 触发
        enabled: true
        auto: true                 # 自动压力压缩 + 上下文溢出恢复
        thresholdRatio: 0.8        # 已用 token 占窗口比例达到多少就压历史
        retainRatio: 0.16          # 最近这段保留为逐字原文的比例
        retainTokens: 0            # >0 时覆盖 retainRatio
        maxSummaryTokens: 2048
        compactionRetries: 2
        maxOverflowRetries: 2

        # 摘要
        faithful: true             # 数字/路径/命令/约束逐字保留
        summaryLanguage: 'auto'    # auto | zh | en
        summaryCacheSize: 32

        # 工具输出压缩
        enableToolCompression: true
        maxToolOutputTokens: 2000  # 超过这个估算值才压
        minToolOutputTokens: 400   # 低于这个值不折腾
        targetToolOutputTokens: 1100

        # 可逆取回
        enableCCR: true
        ccrMaxEntries: 100
        ccrMaxBytes: 10485760
        ccrTtlMs: 3600000
        ccrPersist: true
        ccrStorePath: '~/.dsh/context-guard/ccr'
        retrieveMaxChars: 60000    # 单次取回上限，更长的用 offset 分页

        # 动态组装
        assemblyEnabled: true
        noticeEnabled: true
        reservedOutputTokens: 8192

        logLevel: 'info'
